const a=$a(aId);
let h=`<div class="row"><button id="ab">← Elenco</button></div><div class="row" style="margin-top:8px"><button id="ax">Espandi tutto</button></div>
<h3 style="margin:10px 0 2px">${a.t}</h3>`;
h+=algTree(a);
$('out').innerHTML=h;
$('ab').onclick=()=>{window.aId=null;alg()};
if($('ax'))$('ax').onclick=()=>{const all=[...document.querySelectorAll('.gnb')],open=all.every(x=>x.classList.contains('open'));all.forEach(x=>x.classList.toggle('open',!open));$('ax').textContent=open?'Espandi tutto':'Comprimi tutto'};
document.querySelectorAll('.gh').forEach(g=>g.onclick=()=>g.parentNode.classList.toggle('open'));
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(c.dataset.alg){window.aId=c.dataset.alg;window.vw='g';alg();window.scrollTo(0,0)}else{const el=document.getElementById('gn-'+c.dataset.go);if(el){el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}}})}

const setTab=n=>{tab=n;['t1','t2','t3','t4'].forEach((k,x)=>$(k).classList.toggle('on',x+1===n));$('q').style.display=n===1?'':'none';$('mr').style.display=n>=3?'none':'';$('ar').style.display=n===3?'':'none';$('wl').style.display=(ped&&n<3)?'':'none';render()};
$('t1').onclick=()=>setTab(1);$('t2').onclick=()=>setTab(2);$('t3').onclick=()=>setTab(3);$('t4').onclick=()=>setTab(4);
$('ag').oninput=render;$('au').onchange=render;
$('w').oninput=render;$('q').oninput=render;render();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{const e=document.getElementById('offs');if(e)e.textContent='disponibile offline'}).catch(()=>{const e=document.getElementById('offs');if(e)e.textContent='offline non attivo'})}else{const e=document.getElementById('offs');if(e)e.textContent='offline non supportato'}
</script></body></html>
